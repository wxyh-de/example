<!DOCTYPE html>
<html>
<body>
    <h1>订单列表（Mock 环境）</h1>
    <div id="orderList"></div>

<script>
async function getOrders(page = 1) {
    let list = document.getElementById("orderList");

    // 边界测试：页码不能 < 1
    if (page < 1) {
        list.innerText = "错误：页码不能小于1";
        return;
    }

    let res = await fetch("https://mock.stoplight.io/你的地址/order/list?pageNum="+page+"&pageSize=10");
    let data = await res.json();

    if (data.data.length === 0) {
        list.innerText = "暂无订单（空数据测试）";
        return;
    }

    list.innerHTML = data.data.map(o => `<p>订单号：${o.orderNo} 金额：${o.price}</p>`).join('');
}

// 正常测试
getOrders(1);

// 边界测试（打开下面任意一个）
// getOrders(0);
// getOrders(9999);
</script>
</body>
</html>
