openapi: 3.0.3
info:
  title: 业务系统接口契约
  description: 前后端统一接口标准
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境

paths:
  /user/login:
    post:
      summary: 用户登录
      description: 账号密码登录获取Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: 123456
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  msg: { type: string, example: 登录成功 }
                  data: { type: string, example: eyJhbGciOiJIUzI1NiJ9... }
        '401':
          description: 账号密码错误

  /order/list:
    get:
      summary: 获取订单列表
      parameters:
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - name: pageSize
          in: query
            required: true
            schema:
              type: integer
              example: 10
      responses:
        '200':
          description: 查询成功
